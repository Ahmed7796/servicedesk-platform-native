# Reverse proxy (M5-1). The phone talks only to this address (architecture rule 8):
#   /api/...    -> servicedesk-api (C#)
#   /notify/... -> notification-service (Spring)
# Paths are passed through unchanged: the contracts already carry the /api and /notify prefixes.
# Everything else (the copilot, the brokers, the databases) is not reachable through the proxy.

server {
    listen 80;
    server_name _;

    # Request bodies here are small JSON (login, decisions, device registration).
    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location /api/ {
        proxy_pass http://api:8080;
    }

    location /notify/ {
        proxy_pass http://notify:8081;
    }

    # The proxy's own liveness, for the Compose health check. Not a service health check.
    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
