# Real PostgreSQL via Testcontainers (@ServiceConnection supplies url/user/password).
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
      - org.springframework.boot.amqp.autoconfigure.health.RabbitHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
  datasource:
    password: unused
app:
  notify:
    step-sla: PT1H
  messaging:
    enabled: false
  jwt:
    secret-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
