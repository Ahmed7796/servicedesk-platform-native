server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/notify}
    username: ${DB_USER:notify}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false   # failures go to the dead-letter queue, never loop
        retry:
          enabled: true                   # bounded: 1 try + 2 retries = 3 attempts, then rejected without requeue
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  notify:
    step-sla: ${NOTIFY_STEP_SLA:PT24H}   # ISO-8601; dueAt = pendingSince + this (PT1M for a demo)
    push:
      enabled: ${NOTIFY_PUSH_ENABLED:true}   # false turns sending off
      url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
  messaging:
    enabled: true   # false only in the offline "test" profile
  jwt:
    secret-key: ${JWT_SECRET_KEY}   # base64; decoded to raw bytes
    issuer: ${JWT_ISSUER:ServiceDesk}
    audience: ${JWT_AUDIENCE:ServiceDesk.Api}

management:
  # Actuator's web endpoints are still exposed by default (health). SecurityConfig denies
  # /actuator/**; the contract health is HealthController at /notify/health.
  endpoint:
    health:
      show-details: never
