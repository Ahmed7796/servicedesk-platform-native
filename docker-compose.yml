# Whole demo stack. Passwords and keys come from .env (git-ignored); see .env.example.
# Infrastructure ports are bound to 127.0.0.1 so they are reachable from this machine only.
# The Spring and Python services are added here by the lead when M2-1 and M3-1 need them.
# When they are, the api also waits for their health checks (contracts/events/README.md, Transport).

services:
  api-db:
    # Owned by servicedesk-api (CLAUDE.md, rule 2). Separate from notification-service's postgres.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD is not set. Copy .env.example to .env and fill it in.}
    ports:
      - "127.0.0.1:5433:5432"   # 5433 on the host so it does not clash with notification-service's postgres
    volumes:
      - api-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    # Owned by notification-service (CLAUDE.md, rule 2).
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notify
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and fill it in.}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is not set. Copy .env.example to .env and fill it in.}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is not set. Copy .env.example to .env and fill it in.}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    # Processed-event IDs for idempotent consumers (CLAUDE.md, rule 5). No auth; not exposed beyond localhost.
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./servicedesk-api
      dockerfile: src/ServiceDesk.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Development: runs migrations and seeds demo accounts. Revisit before M6-4 deploys this stack.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=api-db;Port=5432;Database=servicedesk;Username=servicedesk;Password=${API_DB_PASSWORD}"
      Jwt__Key: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is not set. Copy .env.example to .env and set it (openssl rand -base64 32).}
      # Outbox publisher (M1-2b). Same credentials as the rabbitmq service.
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is not set. Copy .env.example to .env and fill it in.}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is not set. Copy .env.example to .env and fill it in.}
      # Triage copilot's client credentials (M1-4a). The copilot service gets the same two values (M3-1).
      ServiceClients__Triage__ClientId: ${TRIAGE_CLIENT_ID:?TRIAGE_CLIENT_ID is not set. Copy .env.example to .env and fill it in.}
      ServiceClients__Triage__ClientSecret: ${TRIAGE_CLIENT_SECRET:?TRIAGE_CLIENT_SECRET is not set. Copy .env.example to .env and set it (openssl rand -base64 32).}
    depends_on:
      api-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Consumers bind their queues before reporting healthy; publishing earlier would drop events.
      notify:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl; the API binary has a probe mode (M1-2b).
      test: ["CMD", "dotnet", "ServiceDesk.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 10s   # starts a .NET process, then a 3 s HTTP timeout
      retries: 5
      start_period: 20s

  notify:
    build:
      context: ./notification-service
    ports:
      - "8081:8081"   # the phone reaches it through the proxy's /notify route (rule 8, M5)
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notify
      DB_USER: notify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and fill it in.}
      # Same signing key as the api (rule 7); issuer and audience use the service's defaults (ServiceDesk, ServiceDesk.Api).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is not set. Copy .env.example to .env and set it (openssl rand -base64 32).}
      # Event consumer (M2-2b). Same credentials as the rabbitmq service.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is not set. Copy .env.example to .env and fill it in.}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is not set. Copy .env.example to .env and fill it in.}
      # Processed eventIds for de-duplication (rule 5).
      REDIS_HOST: redis
      # How long a step may stay pending before it is overdue (M2-3); ISO-8601. Set PT1M to demo overdue.
      NOTIFY_STEP_SLA: ${NOTIFY_STEP_SLA:-PT24H}
      # Push through Expo (M2-4a). Set NOTIFY_PUSH_ENABLED=false to send nothing.
      NOTIFY_PUSH_ENABLED: ${NOTIFY_PUSH_ENABLED:-true}
      EXPO_PUSH_URL: ${EXPO_PUSH_URL:-https://exp.host/--/api/v2/push/send}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Health check comes from the image (notification-service/Dockerfile, curl on /notify/health).
    # /notify/health is DOWN until the notify.events queue is declared and its listener runs,
    # so the api (which waits on this) never publishes before the queue is bound (contracts/events/README.md, Transport).

  copilot:
    build:
      context: ./triage-copilot
    ports:
      - "127.0.0.1:8082:8082"   # local checks only; the phone never calls the copilot (rule 8)
    environment:
      SERVICEDESK_API_URL: http://api:8080
      # Same client credentials the api accepts for POST /api/auth/service-token (M1-4a).
      TRIAGE_CLIENT_ID: ${TRIAGE_CLIENT_ID:?TRIAGE_CLIENT_ID is not set. Copy .env.example to .env and fill it in.}
      TRIAGE_CLIENT_SECRET: ${TRIAGE_CLIENT_SECRET:?TRIAGE_CLIENT_SECRET is not set. Copy .env.example to .env and set it (openssl rand -base64 32).}
    depends_on:
      api:
        condition: service_healthy
    # Health check comes from the image (triage-copilot/Dockerfile, Python stdlib; no curl in slim).

volumes:
  api-db-data:
  pg-data:
  rabbitmq-data:
  redis-data:
